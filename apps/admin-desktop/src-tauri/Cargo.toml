[package]
name = "castquest-admin"
version = "0.1.0"
description = "CastQuest Admin Desktop Application"
authors = ["CastQuest"]
license = "MIT"
repository = "https://github.com/SMSDAO/castquest-frames"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize", "http-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
